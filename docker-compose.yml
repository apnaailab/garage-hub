services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: garagehub
      POSTGRES_USER: garagehub
      POSTGRES_PASSWORD: garagehub_local
    ports:
      - "5432:5432"
    volumes:
      - garagehub-postgres:/var/lib/postgresql/data

volumes:
  garagehub-postgres:
